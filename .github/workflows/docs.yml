name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Check out shared theme
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: MervinPraison/praisonai-docs-theme
          ssh-key: ${{ secrets.PRAISONAI_THEME_DEPLOY_KEY }}
          persist-credentials: false
          path: .praisonai-theme

      - name: Install shared theme
        if: github.event_name != 'pull_request'
        run: |
          pip install ./.praisonai-theme
          echo "PRAISONAI_THEME=praisonai" >> "$GITHUB_ENV"

      - name: Build site
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: bio.praison.ai
